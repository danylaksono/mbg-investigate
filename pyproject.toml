[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbgpipe"
version = "0.2.0"
description = "Incident table and news-article corpus on MBG mass food poisoning in Indonesia"
requires-python = ">=3.11"
dependencies = ["mwparserfromhell>=0.6", "trafilatura>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]
analysis = ["pandas>=2", "scipy>=1.11"]

[project.scripts]
mbgpipe = "mbgpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
